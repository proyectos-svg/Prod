<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Producción SUMWIC - Interno</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-card">
    <header>
        <h2 style="margin:0; font-size: 1.1rem;">🚀 Producción SUMWIC</h2>
        <button onclick="descargarExcelFormatoImagen()" class="btn-excel">EXCEL</button>
    </header>

    <div class="config-grid">
        <div class="field">
            <label>Máquina</label>
            <select id="filtroMaquina" onchange="actualizarVista()">
                <option value="TODAS">Historial Completo</option>
                <option value="CONTAR">📊 MODO CONTAR</option>
                <option value="Máquina 6">Máquina 6</option>
                <option value="Máquina 7">Máquina 7</option>
                <option value="Máquina 8">Máquina 8</option>
            </select>
        </div>
        <div class="field">
            <label>Origen</label>
            <select id="origenDato">
                <option value="México">México</option>
                <option value="Importación">Importación</option>
            </select>
        </div>
    </div>

    <div class="btns-main">
        <button class="btn btn-cam" onclick="toggleCamara()">📷 CÁMARA</button>
        <button class="btn btn-manual" onclick="toggleManual()">✏️ MANUAL</button>
    </div>

    <div id="inputManualArea" style="display:none; margin-bottom:15px;">
        <input type="text" id="serialTexto" placeholder="Pegue el serial aquí..." oninput="manejarEntradaManual(this.value)">
    </div>

    <div id="reader"></div>
    <div id="statusScan" class="scan-status">✅ SERIAL DETECTADO</div>

    <div class="save-bar-compact">
        <div class="field" style="margin-bottom:0">
            <label>Cant. (Pzs)</label>
            <input type="number" id="cantidadEditable" value="0">
        </div>
        <button id="btnAccionPrincipal" class="btn-save" onclick="procesarGuardado()">💾 GUARDAR</button>
    </div>

    <div id="contenedorPrincipal"></div>
</div>

<script src="script.js"></script>
</body>
</html>
